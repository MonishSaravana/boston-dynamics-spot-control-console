[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-mapping"
version = "0.1.0"
description = "Offline RGB-D mapping for the independent SCOPE project"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "Pillow>=11", "scipy>=1.15", "scikit-image>=0.25", "matplotlib>=3.10", "rerun-sdk>=0.38,<0.39"]

[project.optional-dependencies]
detector = ["torch==2.14.1", "torchvision==0.29.1"]
pose = ["torch==2.14.1", "torchvision==0.29.1"]
hands = ["mediapipe>=0.10.35,<0.11"]
perception = ["torch==2.14.1", "torchvision==0.29.1", "transformers>=4.57,<5", "safetensors>=0.6", "opencv-contrib-python>=4.12", "psutil>=7", "h5py>=3.15"]
perception-gui = ["PySide6>=6.8,<7"]

[project.scripts]
scope = "scope.cli:main"

[tool.setuptools.packages.find]
include = ["scope*"]
